<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOC Board · 7 Seasons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1C2B3A; --slate: #2D3F50; --gold: #C4963A;
      --cream: #FAF8F4; --warm-gray: #8C8178; --text: #2A2A2A; --border: #E0D9D0;
    }
    body { font-family: "Inter", sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

    .topbar {
      background: white; border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-family: "Cormorant Garamond", serif; font-size: 1.25rem; font-weight: 600; color: var(--navy); }
    .logo span { color: var(--gold); }
    .topbar-nav { display: flex; gap: 1.5rem; align-items: center; }
    .topbar-nav a { font-size: 0.85rem; color: var(--warm-gray); text-decoration: none; font-weight: 500; }
    .topbar-nav a:hover { color: var(--navy); }
    .nav-name { font-size: 0.85rem; color: var(--navy); font-weight: 500; }

    .container { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-family: "Cormorant Garamond", serif; font-size: 2.25rem; color: var(--navy); margin-bottom: 0.5rem; }
    .page-header p { color: var(--warm-gray); font-size: 0.95rem; line-height: 1.6; max-width: 620px; }

    .quote-block {
      border-left: 3px solid var(--gold); padding: 0.2rem 0 0.2rem 1rem; margin-bottom: 2rem;
      font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.15rem; color: var(--slate);
    }
    .quote-block cite { display: block; font-family: "Inter", sans-serif; font-style: normal; font-size: 0.78rem; color: var(--warm-gray); margin-top: 0.35rem; }

    .tab-row { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
    .tab-btn {
      background: none; border: none; font-family: "Inter", sans-serif; font-size: 0.88rem; font-weight: 500;
      color: var(--warm-gray); padding: 0.75rem 0.25rem; cursor: pointer; margin-right: 1.5rem;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }

    .category-block { margin-bottom: 2rem; }
    .category-title { font-family: "Cormorant Garamond", serif; font-size: 1.35rem; color: var(--navy); margin-bottom: 0.15rem; }
    .category-hint { font-size: 0.82rem; color: var(--warm-gray); margin-bottom: 1rem; }

    .slot-card {
      background: white; border: 1px solid var(--border); border-radius: 12px;
      padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: grid;
      grid-template-columns: 1fr 1fr; gap: 0.6rem 0.9rem;
    }
    .slot-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .slot-field.full { grid-column: 1 / -1; }
    .slot-field label { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warm-gray); }
    .slot-field input {
      border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem;
      font-family: "Inter", sans-serif; font-size: 0.88rem; color: var(--text); background: var(--cream); outline: none;
    }
    .slot-field input:focus { border-color: var(--gold); background: white; }
    @media (max-width: 560px) { .slot-card { grid-template-columns: 1fr; } }

    .save-row { display: flex; align-items: center; gap: 1rem; margin-top: 1rem; }
    .btn-save {
      background: var(--navy); color: white; border: none; border-radius: 8px;
      padding: 0.65rem 1.5rem; font-family: "Inter", sans-serif; font-size: 0.85rem;
      font-weight: 500; cursor: pointer; transition: background 0.2s;
    }
    .btn-save:hover { background: var(--slate); }
    .btn-save:disabled { opacity: 0.6; cursor: default; }
    .save-status { font-size: 0.82rem; color: #3A6040; }

    .loading { text-align: center; padding: 4rem 1.5rem; color: var(--warm-gray); font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">7 <span>Seasons</span></div>
  <div class="topbar-nav">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/decide.html">Start a Decision</a>
    <span class="nav-name" id="nav-name"></span>
    <button onclick="logout()" style="background:none;border:none;font-family:'Inter',sans-serif;font-size:0.82rem;color:var(--warm-gray);cursor:pointer;">Sign out</button>
  </div>
</div>

<div class="container" id="main-content">
  <div class="loading">Loading your MOC Board...</div>
</div>

<script>
  let individualId = localStorage.getItem("7s_individual_id");
  let coupleId = null;
  let partnerName = null;
  let myName = null;
  let activeOwner = null; // set to individualId or "shared" once we know who "me" is

  const CATEGORY_INFO = {
    spiritual:    { title: "Spiritual",    hint: "Who guides your faith and character?" },
    financial:    { title: "Financial",    hint: "Who guides your money and provision?" },
    relational:   { title: "Relational",   hint: "Who guides your marriage and family?" },
    professional: { title: "Professional", hint: "Who guides your career and calling?" }
  };

  async function checkAuth() {
    try {
      const res = await fetch("/api/auth/me");
      if (!res.ok) { window.location.href = "/login.html"; return false; }
      const user = await res.json();
      individualId = user.individual_id;
      localStorage.setItem("7s_individual_id", user.individual_id);
      localStorage.setItem("7s_name", user.name);
      document.getElementById("nav-name").textContent = user.name;
      return true;
    } catch { window.location.href = "/login.html"; return false; }
  }

  async function logout() {
    await fetch("/api/auth/logout", { method: "POST" });
    localStorage.clear();
    window.location.href = "/login.html";
  }

  function escapeHTML(t) {
    return (t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  async function init() {
    if (!await checkAuth()) return;

    try {
      const meRes = await fetch("/api/me/" + individualId);
      const me = await meRes.json();
      coupleId = me.couple_id;
      myName = me.name;
      partnerName = me.partner?.name || null;
    } catch {
      document.getElementById("main-content").innerHTML = `<div class="loading">Could not load your board — try refreshing.</div>`;
      return;
    }

    activeOwner = individualId;
    renderShell();
    loadBoard();
  }

  function renderShell() {
    const el = document.getElementById("main-content");
    el.innerHTML = `
      <div class="page-header">
        <h1>Your MOC Board</h1>
        <p>Every major decision goes easier with the right people in your corner. Break your life into four categories and name three trusted counselors for each — people who are readily accessible, experienced in that area, and have your genuine best interest at heart.</p>
      </div>
      <div class="quote-block">
        "Whoever has your ear, has your future."
        <cite>— Pastor Matthew Reneau</cite>
      </div>
      <div class="tab-row">
        <button class="tab-btn" id="tab-mine" onclick="switchTab(individualId)">My Board</button>
        <button class="tab-btn" id="tab-shared" onclick="switchTab('shared')">${partnerName ? "Our Shared Board" : "Shared Board"}</button>
      </div>
      <div id="board-body"></div>`;
    updateTabHighlight();
  }

  function updateTabHighlight() {
    document.getElementById("tab-mine").classList.toggle("active", activeOwner === individualId);
    document.getElementById("tab-shared").classList.toggle("active", activeOwner === "shared");
  }

  function switchTab(owner) {
    activeOwner = owner;
    updateTabHighlight();
    loadBoard();
  }

  async function loadBoard() {
    const body = document.getElementById("board-body");
    body.innerHTML = `<div class="loading">Loading...</div>`;

    let entries = [];
    try {
      const res = await fetch("/api/moc-board/" + coupleId + "/" + encodeURIComponent(activeOwner));
      const data = await res.json();
      entries = data.entries || [];
    } catch {}

    const byKey = new Map(entries.map(e => [e.category + "::" + e.slot, e]));

    body.innerHTML = Object.keys(CATEGORY_INFO).map(cat => {
      const info = CATEGORY_INFO[cat];
      const slots = [1, 2, 3].map(slot => {
        const e = byKey.get(cat + "::" + slot) || { name: "", contact: "", notes: "" };
        return `
          <div class="slot-card" data-category="${cat}" data-slot="${slot}">
            <div class="slot-field">
              <label>Name</label>
              <input type="text" class="f-name" value="${escapeHTML(e.name)}" placeholder="Who is it?">
            </div>
            <div class="slot-field">
              <label>Contact</label>
              <input type="text" class="f-contact" value="${escapeHTML(e.contact)}" placeholder="Phone, email...">
            </div>
            <div class="slot-field full">
              <label>Why them</label>
              <input type="text" class="f-notes" value="${escapeHTML(e.notes)}" placeholder="What do they bring? (their role, experience, how you know them)">
            </div>
          </div>`;
      }).join("");

      return `
        <div class="category-block">
          <div class="category-title">${info.title}</div>
          <div class="category-hint">${info.hint}</div>
          ${slots}
        </div>`;
    }).join("") + `
      <div class="save-row">
        <button class="btn-save" id="save-btn" onclick="saveBoard()">Save Board</button>
        <span class="save-status" id="save-status"></span>
      </div>`;
  }

  async function saveBoard() {
    const btn = document.getElementById("save-btn");
    const status = document.getElementById("save-status");
    btn.disabled = true;
    status.textContent = "";

    const entries = [...document.querySelectorAll(".slot-card")].map(card => ({
      category: card.dataset.category,
      slot: parseInt(card.dataset.slot),
      name: card.querySelector(".f-name").value,
      contact: card.querySelector(".f-contact").value,
      notes: card.querySelector(".f-notes").value
    }));

    try {
      const res = await fetch("/api/moc-board/" + coupleId + "/" + encodeURIComponent(activeOwner), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ entries })
      });
      status.textContent = res.ok ? "Saved ✓" : "Could not save — try again.";
    } catch {
      status.textContent = "Could not save — try again.";
    }
    btn.disabled = false;
    setTimeout(() => { status.textContent = ""; }, 3000);
  }

  init();
</script>
</body>
</html>
