<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Interview · 7 Seasons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1C2B3A; --slate: #2D3F50; --gold: #C4963A; --gold-pale: #F9F3E8;
      --cream: #FAF8F4; --warm-gray: #8C8178; --text: #2A2A2A; --border: #E0D9D0;
      --green: #2D7A45; --green-pale: #EAF4EE; --red: #C0392B;
    }
    body { font-family: "Inter", sans-serif; background: var(--cream); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      background: white; border-bottom: 1px solid var(--border);
      padding: 0.875rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-shrink: 0;
    }
    .topbar-logo { font-family: "Cormorant Garamond", serif; font-size: 1.1rem; font-weight: 600; color: var(--navy); white-space: nowrap; }
    .topbar-logo span { color: var(--gold); }
    .session-label { flex: 1; text-align: center; font-size: 0.82rem; font-weight: 500; color: var(--navy); }
    .btn-close { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 0.3rem 0.75rem; font-family: "Inter", sans-serif; font-size: 0.75rem; color: var(--warm-gray); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .btn-close:hover { border-color: var(--navy); color: var(--navy); }

    /* Scroll area (gate screens, briefing panel, chat bubbles — all together) */
    .chat-area { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }

    /* Gate / status screens */
    .status-screen { max-width: 480px; margin: 3rem auto; text-align: center; }
    .status-screen h2 { font-family: "Cormorant Garamond", serif; font-size: 1.6rem; color: var(--navy); margin-bottom: 0.75rem; }
    .status-screen p { color: var(--warm-gray); font-size: 0.9rem; line-height: 1.7; margin-bottom: 1.5rem; }
    .btn { background: var(--navy); color: white; border: none; padding: 0.85rem 2rem; border-radius: 8px; font-family: "Inter", sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 1.25rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Briefing panel */
    .briefing-panel { max-width: 680px; width: 100%; margin: 0 auto 0.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .briefing-eyebrow { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); text-align: center; }
    .highlight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 520px) { .highlight-grid { grid-template-columns: 1fr; } }
    .highlight-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.25rem; }
    .highlight-card h3 { font-size: 0.85rem; font-weight: 600; color: var(--navy); margin-bottom: 0.6rem; }
    .highlight-card ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .highlight-card li { font-size: 0.84rem; color: var(--text); line-height: 1.5; display: flex; gap: 0.4rem; }
    .highlight-card li::before { content: "·"; color: var(--gold); font-weight: 700; flex-shrink: 0; }

    .attention-box { background: var(--gold-pale); border: 1px solid #E8C97A; border-radius: 12px; padding: 1rem 1.25rem; }
    .attention-box.none { background: var(--green-pale); border-color: #C8E6D4; }
    .attention-box h3 { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.03em; color: #8A6A20; margin-bottom: 0.6rem; }
    .attention-box.none h3 { color: var(--green); }
    .attention-item { font-size: 0.84rem; color: var(--text); line-height: 1.55; margin-bottom: 0.5rem; }
    .attention-item:last-child { margin-bottom: 0; }
    .attention-item strong { color: var(--navy); }
    .attention-item .involves { font-size: 0.72rem; color: var(--warm-gray); }

    details.questions-preview { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1.25rem; }
    details.questions-preview summary { cursor: pointer; font-size: 0.82rem; font-weight: 500; color: var(--navy); }
    details.questions-preview ul { list-style: none; margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.45rem; }
    details.questions-preview li { font-size: 0.83rem; color: var(--warm-gray); line-height: 1.5; padding-left: 0.9rem; position: relative; }
    details.questions-preview li::before { content: "?"; position: absolute; left: 0; color: var(--gold); font-weight: 700; }

    .briefing-divider { max-width: 680px; width: 100%; margin: 0.25rem auto 0; text-align: center; font-size: 0.75rem; color: #8C8178; letter-spacing: 0.1em; text-transform: uppercase; }

    /* Chat bubbles */
    .bubble-wrap { display: flex; gap: 0.75rem; max-width: 680px; width: 100%; margin: 0 auto; }
    .bubble-wrap.ai   { align-self: center; }
    .bubble-wrap.user { align-self: center; flex-direction: row-reverse; }

    .bubble-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 500; flex-shrink: 0; margin-top: 2px; }
    .bubble-avatar.user-av { background: var(--gold); }

    .bubble { padding: 0.875rem 1.1rem; border-radius: 16px; font-size: 0.95rem; line-height: 1.65; max-width: calc(100% - 48px); }
    .bubble.ai   { background: white; color: var(--text); border-radius: 4px 16px 16px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); white-space: pre-wrap; }
    .bubble.ai strong { font-weight: 600; color: var(--navy); }
    .bubble.user { background: var(--navy); color: white; border-radius: 16px 4px 16px 16px; }

    .typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warm-gray); animation: pulse 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.9); } 30% { opacity: 1; transform: scale(1.1); } }

    /* Complete hint */
    .complete-hint { display: none; background: var(--green-pale); border-top: 1px solid #C8E6D4; padding: 0.85rem 1.5rem; text-align: center; font-size: 0.85rem; color: var(--green); flex-shrink: 0; }
    .complete-hint.visible { display: block; }
    .complete-hint button { background: var(--green); color: white; border: none; border-radius: 8px; padding: 0.45rem 1.25rem; font-family: "Inter", sans-serif; font-size: 0.82rem; font-weight: 500; cursor: pointer; margin-left: 0.75rem; }

    /* Input */
    .listening-label { font-size: 0.72rem; color: var(--red); font-weight: 500; text-align: center; padding: 0.25rem 0; display: none; }
    .listening-label.visible { display: block; }
    .listening-progress { display: none; height: 3px; margin: 0 1.5rem 0.5rem; border-radius: 2px; overflow: hidden; background: var(--border); }
    .listening-progress.visible { display: block; }
    .listening-progress-bar { width: 30%; height: 100%; border-radius: 2px; background: var(--red); animation: mic-progress 1.3s ease-in-out infinite; }
    @keyframes mic-progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(430%); } }
    .input-area { background: white; border-top: 1px solid var(--border); padding: 1rem 1.5rem; display: none; gap: 0.75rem; align-items: flex-end; flex-shrink: 0; }
    .input-area.visible { display: flex; }
    .input-area textarea { flex: 1; border: 1.5px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem; font-family: "Inter", sans-serif; font-size: 0.95rem; resize: none; outline: none; background: var(--cream); color: var(--text); min-height: 48px; max-height: 140px; line-height: 1.5; transition: border-color 0.2s; }
    .input-area textarea:focus { border-color: var(--navy); background: white; }
    .btn-mic { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--border); background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.2s; color: var(--warm-gray); }
    .btn-mic:hover { border-color: var(--navy); color: var(--navy); }
    .btn-mic.listening { background: var(--red); border-color: var(--red); color: white; animation: mic-pulse 1s ease-in-out infinite; }
    @keyframes mic-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .btn-send { background: var(--navy); border: none; color: white; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
    .btn-send:hover { background: var(--slate); }
    .btn-send:disabled, .btn-mic:disabled { opacity: 0.4; cursor: default; }

    /* Speaker select -- who's responding, gates the input */
    .speaker-bar { background: white; border-top: 1px solid var(--border); padding: 0.75rem 1.5rem 0; display: none; flex-direction: column; gap: 0.5rem; flex-shrink: 0; }
    .speaker-bar.visible { display: flex; }
    .speaker-hint { font-size: 0.72rem; color: var(--warm-gray); text-align: center; }
    .speaker-hint strong { color: var(--navy); font-weight: 600; }
    .speaker-pills { display: flex; gap: 0.6rem; }
    .speaker-pill {
      flex: 1; background: var(--cream); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 0.6rem 1rem; font-family: "Inter", sans-serif; font-size: 0.88rem; font-weight: 500;
      color: var(--text); cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .speaker-pill:hover { border-color: var(--navy); }
    .speaker-pill.selected { background: var(--navy); border-color: var(--navy); color: white; }

    .msg-speaker { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem; text-align: right; }
    .bubble-wrap.user { flex-direction: row-reverse; align-items: flex-start; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">7 <span>Seasons</span></div>
  <div class="session-label">Final Interview</div>
  <button onclick="toggleVoice()" id="voice-toggle" title="Toggle voice" style="background:none;border:none;font-size:1.1rem;cursor:pointer;padding:0.25rem 0.4rem;border-radius:6px;transition:opacity 0.2s;">🔊</button>
  <button class="btn-close" onclick="closeToDashboard()">Save &amp; close</button>
</div>

<div class="chat-area" id="chat-area"></div>

<div class="complete-hint" id="complete-hint">
  Seven has finished the Final Interview.
  <button onclick="completeInterview()">Complete Final Interview →</button>
</div>

<div class="speaker-bar" id="speaker-bar">
  <div class="speaker-hint" id="speaker-hint">Only one of you responds at a time — <strong>select your name</strong> before typing or speaking, so Seven knows who's talking.</div>
  <div class="speaker-pills" id="speaker-pills"></div>
</div>

<div class="listening-label" id="listening-label">Listening...</div>
<div class="listening-progress" id="listening-progress"><div class="listening-progress-bar"></div></div>
<div class="input-area" id="input-area">
  <textarea id="msg-input" placeholder="Select your name above first..." rows="1" disabled></textarea>
  <button class="btn-mic" id="mic-btn" onclick="toggleMic()" title="Tap to speak" disabled>
    <svg fill="currentColor" viewBox="0 0 24 24" width="18" height="18">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
    </svg>
  </button>
  <button class="btn-send" id="send-btn" onclick="sendMessage()" disabled>
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
    </svg>
  </button>
</div>

<script>
  let individualId = localStorage.getItem("7s_individual_id");
  let coupleId     = localStorage.getItem("7s_couple_id");
  let isStreaming  = false;
  let interviewDone = false;
  let coupleNames  = [];
  let selectedSpeaker = null;
  let inputStreamReady = true;

  async function checkAuth() {
    try {
      const res = await fetch("/api/auth/me");
      if (!res.ok) { window.location.href = "/login.html"; return false; }
      const user = await res.json();
      individualId = user.individual_id;
      coupleId     = user.couple_id;
      localStorage.setItem("7s_individual_id", user.individual_id);
      localStorage.setItem("7s_couple_id", user.couple_id);
      return true;
    } catch { window.location.href = "/login.html"; return false; }
  }

  function closeToDashboard() { window.location.href = "/dashboard.html"; }

  // ── Status / gate screens ───────────────────────────────────────────────────
  function renderStatus(html) {
    document.getElementById("chat-area").innerHTML = `<div class="status-screen">${html}</div>`;
  }

  function renderNotReady() {
    renderStatus(`
      <h2>Not quite yet</h2>
      <p>The Final Interview happens once both of you have completed your individual discovery. Head back to your dashboard to see what's left.</p>
      <button class="btn" onclick="closeToDashboard()">Back to Dashboard</button>
    `);
  }

  function renderGenerateBriefingScreen() {
    renderStatus(`
      <h2>You're both ready.</h2>
      <p>Before you sit down together, Seven will review what each of you shared individually and prepare for this conversation — the key things that stood out, and a few questions worth asking now that you can see both of your discoveries together.</p>
      <button class="btn" onclick="generateBriefing()">Prepare Our Final Interview</button>
    `);
  }

  function renderGeneratingBriefing() {
    renderStatus(`
      <div class="spinner"></div>
      <h2>Preparing your Final Interview...</h2>
      <p>Seven is reviewing both of your individual discoveries. This takes about half a minute.</p>
    `);
  }

  async function generateBriefing() {
    renderGeneratingBriefing();
    try {
      const res = await fetch("/api/final-interview/generate-briefing", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ couple_id: coupleId })
      });
      const data = await res.json();
      if (!res.ok) {
        renderStatus(`<h2>Something went wrong</h2><p>${data.error || "Please try again."}</p><button class="btn" onclick="generateBriefing()">Try Again</button>`);
        return;
      }
      showBriefingAndChat(data.briefing, []);
      await streamMessage("__START__");
    } catch {
      renderStatus(`<h2>Something went wrong</h2><p>Please try again.</p><button class="btn" onclick="generateBriefing()">Try Again</button>`);
    }
  }

  // ── Briefing panel ──────────────────────────────────────────────────────────
  function escapeHTML(t) {
    return (t || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function renderBriefingPanel(briefing) {
    const highlights = briefing.spouse_highlights || [];
    const attention   = briefing.immediate_attention || [];
    const questions    = briefing.joint_questions || [];

    const highlightCards = highlights.map(h => `
      <div class="highlight-card">
        <h3>${escapeHTML(h.name)}</h3>
        <ul>${(h.highlights || []).map(x => `<li>${escapeHTML(x)}</li>`).join("")}</ul>
      </div>`).join("");

    const attentionHTML = attention.length
      ? `<div class="attention-box">
          <h3>Worth Talking Through Together</h3>
          ${attention.map(a => `
            <div class="attention-item">
              <strong>${escapeHTML(a.title)}</strong> — ${escapeHTML(a.description)}
              ${a.involves && a.involves.length ? `<div class="involves">${escapeHTML(a.involves.join(", "))}</div>` : ""}
            </div>`).join("")}
        </div>`
      : `<div class="attention-box none"><h3>Nothing Flagged as Urgent</h3><div class="attention-item">This conversation can stay exploratory.</div></div>`;

    const questionsHTML = questions.length
      ? `<details class="questions-preview">
          <summary>Seven's discussion guide (${questions.length} questions)</summary>
          <ul>${questions.map(q => `<li>${escapeHTML(q)}</li>`).join("")}</ul>
        </details>`
      : "";

    return `
      <div class="briefing-panel">
        <div class="briefing-eyebrow">What Seven Prepared</div>
        <div class="highlight-grid">${highlightCards}</div>
        ${attentionHTML}
        ${questionsHTML}
      </div>
      <div class="briefing-divider">· · ·</div>`;
  }

  function showBriefingAndChat(briefing, messages) {
    document.getElementById("chat-area").innerHTML = renderBriefingPanel(briefing);
    document.getElementById("input-area").classList.add("visible");
    renderSpeakerBar();
    (messages || []).forEach(m => {
      if (m.role === "user") {
        const parsed = parseSpeakerPrefix(m.content);
        addBubble("user", parsed.text, parsed.speaker);
      } else {
        addBubble("ai", m.content);
      }
    });
    scrollToBottom();
  }

  // ── Speaker select (who's responding) ───────────────────────────────────────
  // This is a shared, one-device joint session with no voice recognition --
  // Seven has no way to tell who's talking unless the UI makes them say so
  // explicitly before every turn.
  function parseSpeakerPrefix(content) {
    for (const name of coupleNames) {
      const prefix = name + ": ";
      if (content.startsWith(prefix)) return { speaker: name, text: content.slice(prefix.length) };
    }
    return { speaker: null, text: content };
  }

  function renderSpeakerBar() {
    const bar = document.getElementById("speaker-bar");
    if (!coupleNames.length) { bar.classList.remove("visible"); return; }
    document.getElementById("speaker-pills").innerHTML = coupleNames.map(n =>
      `<button type="button" class="speaker-pill" data-name="${escapeHTML(n)}" onclick="selectSpeaker(${JSON.stringify(n)})">${escapeHTML(n)}</button>`
    ).join("");
    bar.classList.add("visible");
  }

  function selectSpeaker(name) {
    if (interviewDone) return;
    selectedSpeaker = name;
    document.querySelectorAll(".speaker-pill").forEach(p => p.classList.toggle("selected", p.dataset.name === name));
    document.getElementById("msg-input").placeholder = "Type your response, or use the mic...";
    applyInputState();
  }

  function applyInputState() {
    const ready = inputStreamReady && !interviewDone && !!selectedSpeaker;
    document.getElementById("msg-input").disabled = !ready;
    document.getElementById("send-btn").disabled  = !ready;
    document.getElementById("mic-btn").disabled   = !ready;
  }

  // ── Chat helpers ─────────────────────────────────────────────────────────────
  function scrollToBottom() { const a = document.getElementById("chat-area"); a.scrollTop = a.scrollHeight; }

  function addBubble(role, text, speakerName) {
    const area = document.getElementById("chat-area");
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap " + role;
    const av = document.createElement("div");
    av.className = "bubble-avatar" + (role === "user" ? " user-av" : "");
    av.textContent = role === "user" ? (speakerName ? speakerName.charAt(0).toUpperCase() : "?") : "7";

    if (role === "user" && speakerName) {
      const contentWrap = document.createElement("div");
      contentWrap.style.cssText = "display:flex; flex-direction:column; max-width:calc(100% - 48px);";
      const label = document.createElement("div");
      label.className = "msg-speaker";
      label.textContent = speakerName;
      const bubble = document.createElement("div");
      bubble.className = "bubble user";
      bubble.textContent = text || "";
      contentWrap.appendChild(label);
      contentWrap.appendChild(bubble);
      wrap.appendChild(av);
      wrap.appendChild(contentWrap);
      area.appendChild(wrap);
      scrollToBottom();
      return bubble;
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    if (role === "ai" && text) {
      bubble.innerHTML = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/([^!?\n]+\?)/g,"<strong>$1</strong>");
    } else {
      bubble.textContent = text || "";
    }
    wrap.appendChild(av);
    wrap.appendChild(bubble);
    area.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function addTypingIndicator() {
    const area = document.getElementById("chat-area");
    const wrap = document.createElement("div"); wrap.className = "bubble-wrap ai"; wrap.id = "typing-wrap";
    const av = document.createElement("div"); av.className = "bubble-avatar"; av.textContent = "7";
    const b = document.createElement("div"); b.className = "bubble ai";
    b.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    b.style.padding = "1rem 1.25rem";
    wrap.appendChild(av); wrap.appendChild(b);
    area.appendChild(wrap); scrollToBottom();
  }
  function removeTypingIndicator() { document.getElementById("typing-wrap")?.remove(); }

  function setInputEnabled(on) {
    inputStreamReady = on;
    applyInputState();
  }

  // ── Load ─────────────────────────────────────────────────────────────────────
  async function init() {
    if (!await checkAuth()) return;
    const data = await fetch("/api/final-interview/" + coupleId).then(r => r.json());
    coupleNames = data.names || [];

    if (!data.both_complete) { renderNotReady(); return; }
    if (!data.briefing_ready) { renderGenerateBriefingScreen(); return; }

    showBriefingAndChat(data.briefing, data.messages);

    if (data.completed) {
      interviewDone = true;
      setInputEnabled(false);
      document.getElementById("input-area").classList.add("visible");
      document.getElementById("speaker-bar").classList.remove("visible");
    }

    const lastAI = (data.messages || []).filter(m => m.role === "assistant").pop()?.content || "";
    if (lastAI.toLowerCase().includes("complete your final interview")) {
      document.getElementById("complete-hint").classList.add("visible");
    }

    if (!data.messages || data.messages.length === 0) {
      await streamMessage("__START__");
    }
  }

  // ── Send ──────────────────────────────────────────────────────────────────────
  async function sendMessage() {
    if (isStreaming || interviewDone || !selectedSpeaker) return;
    const input = document.getElementById("msg-input");
    const text  = input.value.trim();
    if (!text) return;
    input.value = ""; input.style.height = "auto";
    const speakerForThisTurn = selectedSpeaker;
    addBubble("user", text, speakerForThisTurn);
    setInputEnabled(false);
    await streamMessage(text, speakerForThisTurn);
    // Require the next turn to explicitly pick a name again -- never carry
    // the last selection over, so it's always unambiguous whose turn it is.
    selectedSpeaker = null;
    document.querySelectorAll(".speaker-pill").forEach(p => p.classList.remove("selected"));
    document.getElementById("msg-input").placeholder = "Select your name above first...";
    setInputEnabled(true);
  }

  document.getElementById("msg-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById("msg-input").addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
  });

  async function streamMessage(userMessage, speaker) {
    isStreaming = true;
    speechSynthesis.cancel();
    addTypingIndicator();
    let fullText = "", aiBubble = null;

    try {
      const body = { couple_id: coupleId, message: userMessage };
      if (speaker) body.speaker = speaker;
      const res = await fetch("/api/final-interview/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) { removeTypingIndicator(); addBubble("ai", "Something went wrong. Please try again."); isStreaming = false; return; }

      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n"); buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6).trim();
          if (payload === "[DONE]") break;
          try {
            const data = JSON.parse(payload);
            if (data.text) {
              if (!aiBubble) { removeTypingIndicator(); aiBubble = addBubble("ai", ""); }
              fullText += data.text;
              aiBubble.textContent = fullText;
              scrollToBottom();
            }
          } catch {}
        }
      }

      if (aiBubble) {
        aiBubble.innerHTML = fullText.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/([^!?\n]+\?)/g,"<strong>$1</strong>");
      }

      if (fullText.toLowerCase().includes("complete your final interview")) {
        document.getElementById("complete-hint").classList.add("visible");
      }

      speak(fullText);
    } catch {
      removeTypingIndicator();
      addBubble("ai", "Connection error. Please try again.");
    }
    isStreaming = false;
    document.getElementById("msg-input").focus();
  }

  // ── Complete interview ────────────────────────────────────────────────────────
  async function completeInterview() {
    await fetch("/api/final-interview/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ couple_id: coupleId })
    });
    window.location.href = "/report.html";
  }

  // ── Voice ──────────────────────────────────────────────────────────────────────
  let recognition = null, micShouldBeActive = false, micBaseText = "";
  let micStoppedByUser = false, micRestartAttempts = 0;
  const MAX_MIC_RESTART_ATTEMPTS = 5;

  function setupMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { document.getElementById("mic-btn").style.display = "none"; return; }
    recognition = new SR();
    recognition.continuous = true; recognition.interimResults = true; recognition.lang = "en-US";
    recognition.onstart = () => { document.getElementById("mic-btn").classList.add("listening"); document.getElementById("listening-label").classList.add("visible"); document.getElementById("listening-progress").classList.add("visible"); };
    recognition.onresult = (e) => { const t = Array.from(e.results).map(r => r[0].transcript).join(""); const ta = document.getElementById("msg-input"); ta.value = micBaseText ? micBaseText + " " + t : t; ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight,140)+"px"; };
    recognition.onend = () => {
      if (micShouldBeActive && !isStreaming) { micBaseText = document.getElementById("msg-input").value.trim(); try { recognition.start(); } catch {} return; }
      document.getElementById("mic-btn").classList.remove("listening"); document.getElementById("listening-label").classList.remove("visible"); document.getElementById("listening-progress").classList.remove("visible");
      const text = document.getElementById("msg-input").value.trim();
      if (text && micStoppedByUser && !isStreaming) sendMessage();
      micStoppedByUser = false;
    };
    recognition.onerror = (e) => {
      if (e.error === "aborted") return;
      const restartable = ["no-speech", "network", "audio-capture"];
      if (restartable.includes(e.error) && micShouldBeActive && !isStreaming && micRestartAttempts < MAX_MIC_RESTART_ATTEMPTS) {
        micRestartAttempts++;
        micBaseText = document.getElementById("msg-input").value.trim();
        try { recognition.start(); } catch {}
        return;
      }
      micShouldBeActive = false; micRestartAttempts = 0;
      document.getElementById("mic-btn").classList.remove("listening"); document.getElementById("listening-label").classList.remove("visible"); document.getElementById("listening-progress").classList.remove("visible");
    };
  }

  function toggleMic() {
    if (!recognition || isStreaming || !selectedSpeaker) return;
    if (micShouldBeActive) { micShouldBeActive = false; micStoppedByUser = true; recognition.stop(); }
    else { micShouldBeActive = true; micStoppedByUser = false; micRestartAttempts = 0; micBaseText = document.getElementById("msg-input").value.trim(); try { recognition.start(); } catch {} }
  }

  // ── TTS ───────────────────────────────────────────────────────────────────────
  let voiceEnabled = true, selectedVoice = null;

  function setupVoices() {
    function pick() {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      const preferred = ["Microsoft Aria Online (Natural) - English (United States)", "Microsoft Jenny Online (Natural) - English (United States)", "Microsoft Zira - English (United States)", "Samantha", "Google US English"];
      for (const name of preferred) { const v = voices.find(v => v.name === name); if (v) { selectedVoice = v; return; } }
      selectedVoice = voices.find(v => v.lang.startsWith("en-US")) || voices[0];
    }
    pick();
    speechSynthesis.onvoiceschanged = pick;
  }

  function stripMarkdown(text) {
    return text.replace(/\*\*(.*?)\*\*/g,"$1").replace(/\*(.*?)\*/g,"$1").replace(/#{1,6}\s/g,"").replace(/`(.*?)`/g,"$1").trim();
  }

  function speak(text) {
    if (!voiceEnabled || !text) return;
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(stripMarkdown(text));
    if (selectedVoice) utt.voice = selectedVoice;
    utt.rate = 1.01; utt.pitch = 1.0; utt.volume = 1.0;
    speechSynthesis.speak(utt);
  }

  function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    speechSynthesis.cancel();
    const btn = document.getElementById("voice-toggle");
    btn.textContent = voiceEnabled ? "🔊" : "🔇";
    btn.style.opacity = voiceEnabled ? "1" : "0.4";
  }

  setupMic();
  setupVoices();
  init();
</script>
</body>
